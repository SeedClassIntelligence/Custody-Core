# One-click deploy on Render (render.com): New > Blueprint > pick this repository.
# Render builds the Dockerfile, gives the service a public https address, and asks for the values marked
# sync: false. The two server secrets are generated by Render and never leave it. Steps: docs/deploy/RENDER.md
services:
  - type: web
    name: custody-core
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      # Supabase > Project Settings > Database > Connection string > Session pooler (port 5432). Not the
      # direct connection: it is IPv6-only and Render cannot reach it.
      - key: DATABASE_URL
        sync: false
      # Supabase > Project Settings > API: the Project URL and the anon / publishable key (both public).
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      # The same two again, for the browser app (Render passes them to the Docker build).
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      # Generated by Render: a random 256-bit value, base64. Keep a copy of MFA_ENCRYPTION_KEY: if it is lost,
      # everyone sets up their authenticator again.
      - key: APP_DB_PASSWORD
        generateValue: true
      - key: MFA_ENCRYPTION_KEY
        generateValue: true
